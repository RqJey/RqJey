name: RQJEY CMS publish

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload generated by /admin/"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rqjey-cms-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'RqJey'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply CMS operation
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
        run: python3 scripts/cms_apply.py

      - name: Validate published content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("content/site-content.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("news", []), list), "News must be a list"
          assert isinstance(data.get("projects", []), list), "Projects must be a list"
          print(f"Validated: {len(data.get('news', []))} news item(s), {len(data.get('projects', []))} project(s)")
          PY

      - name: Commit and publish directly to main
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes were produced. Nothing was published."
            exit 1
          fi
          git commit -m "cms: publish content update"
          git push origin HEAD:main
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Published commit could not be confirmed on origin/main."
            exit 1
          fi
          echo "commit=$local_sha" >> "$GITHUB_OUTPUT"
          echo "## CMS publication successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Content was committed directly to `main` and verified on GitHub." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `$local_sha`" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Pages deployment is triggered by the update to the publishing branch." >> "$GITHUB_STEP_SUMMARY"
