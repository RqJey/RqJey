name: RQJEY CMS publish

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload generated by /admin/"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rqjey-cms-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'RqJey'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply CMS operation
        env:
          CMS_PAYLOAD: ${{ inputs.payload }}
        run: python3 scripts/cms_apply.py

      - name: Create CMS update branch
        id: branch
        run: echo "name=cms/update-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add content/site-content.json assets/cms
          if git diff --cached --quiet; then
            echo "No content changes to publish."
            exit 0
          fi
          git commit -m "cms: publish content update"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "CMS: publish content update" \
            --body "Automated content update submitted through RQJEY CMS. Please review the generated content changes before merging."
