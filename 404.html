<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <meta name="robots" content="noindex,follow">
  <title>404 — Страница не найдена | RqJey Mods</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("rqjey-theme");
        if (["light", "dark", "system"].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:32px 20px;position:relative;isolation:isolate;overflow:hidden}
    .error-card{width:min(100%,590px);text-align:center;padding:clamp(28px,6vw,58px);border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:0 28px 90px #00000018;position:relative}
    .error-code{font:800 clamp(88px,22vw,154px)/.9 Manrope,sans-serif;letter-spacing:-.095em;margin:0 0 22px;color:var(--accent);text-shadow:0 12px 45px color-mix(in srgb,var(--accent) 22%,transparent)}
    .error-mark{display:inline-grid;place-items:center;width:58px;height:58px;margin:0 auto 24px;border:1px solid var(--line);border-radius:18px;background:var(--surface2);color:var(--accent);font:800 24px Manrope}
    .error-kicker{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    .error-title{font:800 clamp(23px,5vw,32px)/1.2 Manrope,sans-serif;letter-spacing:-.04em;margin:0 0 12px;color:var(--text)}
    .error-copy{max-width:390px;margin:0 auto 27px;color:var(--muted);font-size:13px;line-height:1.8}
    .error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .error-button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 17px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--text);font:700 12px 'DM Sans',sans-serif;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
    .error-button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .error-button:hover{transform:translateY(-2px);border-color:var(--accent)}
    .error-foot{margin-top:30px;color:var(--subtle);font-size:10px;letter-spacing:.08em}
    .error-orbit{position:absolute;width:420px;height:420px;border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
    .error-orbit:before,.error-orbit:after{content:"";position:absolute;border:1px solid color-mix(in srgb,var(--accent) 10%,transparent);border-radius:50%;inset:42px}
    .error-orbit:after{inset:95px}
    @media(max-width:520px){.error-card{padding:30px 22px}.error-orbit{width:300px;height:300px}.error-actions{flex-direction:column}.error-button{width:100%}}
    @media(prefers-reduced-motion:no-preference){.error-card{animation:error-enter .45s ease-out both}@keyframes error-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-orbit" aria-hidden="true"></div>
    <section class="error-card" aria-labelledby="errorTitle">
      <div class="error-mark" aria-hidden="true">rq.</div>
      <p class="error-kicker" data-ru="ОШИБКА НАВИГАЦИИ" data-en="NAVIGATION ERROR">ОШИБКА НАВИГАЦИИ</p>
      <p class="error-code" aria-label="404">404</p>
      <h1 class="error-title" id="errorTitle" data-ru="Кажется, этой страницы нет." data-en="Looks like this page is missing.">Кажется, этой страницы нет.</h1>
      <p class="error-copy" data-ru="Возможно, ссылка устарела или адрес был введён с ошибкой. Не переживай — главная страница всё ещё на месте." data-en="The link may be outdated or the address may contain a typo. No worries — the homepage is still here.">Возможно, ссылка устарела или адрес был введён с ошибкой. Не переживай — главная страница всё ещё на месте.</p>
      <div class="error-actions">
        <a class="error-button primary" href="./" data-ru="← На главную" data-en="← Back to home">← На главную</a>
        <button class="error-button" id="retryButton" type="button" data-ru="Обновить страницу ↻" data-en="Try again ↻">Обновить страницу ↻</button>
      </div>
      <p class="error-foot">RQJEY MODS <span aria-hidden="true">·</span> 404</p>
    </section>
  </main>
  <script>
    (function () {
      var language = "ru";
      try { language = localStorage.getItem("rqjey-language") || "ru"; } catch (_) {}
      language = language === "en" ? "en" : "ru";
      document.documentElement.lang = language;
      document.querySelectorAll("[data-ru][data-en]").forEach(function (node) {
        node.textContent = node.getAttribute("data-" + language);
      });
      document.getElementById("retryButton").addEventListener("click", function () {
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
